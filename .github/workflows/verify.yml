name: verify

# The merge gate, a Claude Code hook, lets an agent merge a PR only when the job
# below concluded SUCCESS on the PR's head. The gate matches the workflow name and
# the job name, so both stay "verify". Written by the verify-ci skill.
#
# The job gets no secrets, so no test can reach production.

on:
  pull_request:
  push:
    branches: ["main"]
  # Weekly run on the default branch, so a red that lands without a PR is still seen.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history. A check that reads git history, such as which commit added a
      # file, gets a false red from a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # numpy for the suite's ndarray, qconfluence and qregime sections, at the version the Mac
      # runs them with (2.0.2 on 2026-10-25). Without numpy those sections are SKIP and the
      # suite still exits 0, so the last line fails the job when anything was skipped.
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy==2.0.2

      - name: Run the test suite
        run: |
          python tests/test_all.py > "$RUNNER_TEMP/suite.out" || { cat "$RUNNER_TEMP/suite.out"; exit 1; }
          cat "$RUNNER_TEMP/suite.out"
          grep -q "sections skipped 0$" "$RUNNER_TEMP/suite.out" || { echo "a section was skipped, so its numpy checks did not run"; exit 1; }
